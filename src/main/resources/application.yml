server:
  port: 8080

logging:
  level:
    com.traindetection: INFO
    root: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

audio:
  sample-rate: 44100.0
  sample-size-in-bits: 16
  channels: 1
  signed: true
  big-endian: false
  buffer-size: 4096
  fft-size: 1024
  noise-threshold: 0.05
  train-detection-threshold: 0.2

spring:
  devtools:
    restart:
      enabled=false